name: Eval gate

# A change to the core plugin's prose passes only without a quality regression on its 13 eval cases:
# overall score at most 0.03 below plugins/moku/evals/baselines/gate.json, no case losing more than one
# run of three. Cost and time land in the job summary. One run costs about $11 and takes 6–8 minutes.
on:
  pull_request:
    paths:
      - "plugins/moku/**"
      - "!plugins/moku/evals-long/**"
      - "!plugins/moku/evals-manual/**"
      - "scripts/evals-gate.mjs"
      - ".github/workflows/evals.yml"
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
      # The tests-* fixtures run `bun test`; the eval sandbox on Linux needs bubblewrap and socat
      - name: Install Claude Code, Bun and the sandbox tools
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap socat
          npm install -g @anthropic-ai/claude-code@2.1.296 bun@1.4.3
          git config --global user.name eval && git config --global user.email eval@example.test
      - name: Eval gate
        run: npm run evals:gate
